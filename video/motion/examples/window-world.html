<!doctype html>
<!-- Window World: a 3D space with floating 2D windows (browser, app, video, terminal, phone, card), a moving camera,
     kinetic titles and premium shot transitions. SCRIPT-DRIVEN: to make a new film, edit only SCRIPT below.
       - windows: declare each window once (kind, size, content). A window is visible in every shot that lists it under
         `show`, glides to its new pos/rot when the shot changes, and exits when a later shot stops listing it.
       - shots: camera, title, the windows to show. `flat` makes a full-frame 2D type shot instead (one shot in four).
       - cut: the transition INTO a shot when the layer changes (world <-> flat): any Kinetic.SHOT name.
     Text fx: any Kinetic.TEXT name. Window enter: rise drop fly flip unfold scale fade.
     Render: node render.mjs examples/window-world.html --mblur 4   (60 fps, 2x supersampled by default) -->
<html><head><meta charset="utf-8">
<script src="../lib/motion.js"></script>
<script src="../lib/kinetic.js"></script>
<script src="../lib/world3d.js"></script>
<style>
*{margin:0;box-sizing:border-box}
html,body{background:#000;overflow:hidden}
#film{position:absolute;left:0;top:0;overflow:hidden;font-family:"Inter","Segoe UI",system-ui,sans-serif}
.layer{position:absolute;inset:0;overflow:hidden}
.title{position:absolute;font-weight:750;letter-spacing:-0.03em;line-height:1.05}
.sub{position:absolute;font-weight:450;opacity:.78}
.flat{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;font-weight:800;letter-spacing:-0.04em;line-height:1.02;text-align:center}
code{font-family:"JetBrains Mono","Cascadia Code",Consolas,monospace}
</style></head><body><div id="film"></div><script>
// ======================= SCRIPT: the only part to edit for a new film =======================
const CODE = `<pre style="padding:26px 30px;font:19px/1.65 'Cascadia Code',Consolas,monospace;color:#C9CCE0">
<span style="color:#C792EA">const</span> { springAt, stage } = Motion;

<span style="color:#C792EA">function</span> <span style="color:#82AAFF">render</span>(t) {
  <span style="color:#C792EA">const</span> p = <span style="color:#82AAFF">springAt</span>(t, <span style="color:#F78C6C">0.5</span>, <span style="color:#C3E88D">"card"</span>);
  ball.style.transform =
    <span style="color:#C3E88D">\`translateY(\${(1 - p) * 240}px)\`</span>;
  Kinetic.<span style="color:#82AAFF">render</span>(t);
}
<span style="color:#82AAFF">stage</span>({ fps: <span style="color:#F78C6C">60</span>, duration: <span style="color:#F78C6C">14</span>, render });</pre>`;
const PREVIEW = `<div style="position:absolute;inset:0;background:radial-gradient(90% 90% at 30% 20%,#3A2D7A,#120F24)">
  <div data-ball style="position:absolute;left:50%;top:58%;width:84px;height:84px;margin:-42px;border-radius:24px;background:#8B7CFF"></div>
  <div style="position:absolute;left:30%;right:30%;top:calc(58% + 46px);height:3px;border-radius:2px;background:rgba(255,255,255,.25)"></div></div>`;
const FROZEN = `<div style="position:absolute;inset:0;display:grid;place-items:center;background:#F7F6FB">
  <div style="text-align:center"><code style="font-size:64px;font-weight:700;color:#16161E">t = 4.20 s</code>
  <div style="margin-top:14px;font-size:24px;color:#6E6E80">same pixels, every render</div></div></div>`;

const SCRIPT = {
  width: 1920, height: 1080, fps: 60, duration: 14,
  theme: "night", accent: "#8B7CFF", text: "#F4F3FA",
  windows: {
    editor: { kind: "app", title: "scene.html", w: 780, h: 480, html: CODE },
    preview: { kind: "video", w: 660, h: 372, html: PREVIEW, video: { start: 0.4, length: 14 },
      draw: (t, body) => { const u = (t + 1.2) % 1.6; body.querySelector("[data-ball]").style.transform = `translateY(${-(1 - Motion.spring(u, { zeta: 0.42, omega: 12 })) * 150}px)`; } },
    browser: { kind: "browser", title: "scene.html", url: "localhost:5173/scene.html?t=4.20", w: 760, h: 470, tone: "light", html: FROZEN },
    term: { kind: "terminal", title: "render.mjs", w: 1000, h: 300, font: 26,
      lines: [[10.9, "$ node render.mjs scene.html --mblur 2"], [11.9, "scene: 840 frames  3840x2160 → 1920x1080 @60 mblur 2", 110], [12.8, "✓ out/scene.mp4", 60]] },
  },
  shots: [
    { at: 0, from: { pos: [0, -300, 2700], look: [0, 0, 0] }, camera: { pos: [0, -90, 1750], look: [0, -10, 0] }, move: 2.4,
      title: { text: "Write the film as code.", fx: "mask-up", sub: "Every frame is render(t).", pos: "top-left" },
      show: { editor: { pos: [-430, 40, 0], rot: [0, 16, 0], enter: "flip" }, preview: { pos: [450, 0, -160], rot: [0, -15, 0], enter: "rise" } } },
    { at: 4, camera: { pos: [600, -170, 1450], look: [160, 0, -60] }, move: 1.6,
      title: { text: "Scrub to any frame.", fx: "blur-in", sub: "?t=4.20 freezes the exact pixels.", pos: "top-left" },
      show: { preview: { pos: [470, 70, 60], rot: [0, -12, 0] }, browser: { pos: [-520, -40, -240], rot: [0, 22, 0], enter: "fly" } } },
    { at: 7.6, cut: "iris", flat: { bg: "#F4F1EA", color: "#14141C", size: 150,
      lines: [{ text: "60 fps.", fx: "stomp" }, { text: "Supersampled.", fx: "tumble" }, { text: `<span style="color:#7C5CFF">Motion-blurred.</span>`, fx: "blur-in" }] } },
    { at: 10.4, cut: "zoom-through", camera: { pos: [0, -230, 1500], look: [0, -40, 0] }, move: 0.01,
      title: { text: "Render. Ship.", fx: "scramble", sub: "One skill, one command.", subFx: "spread", pos: "top" },
      show: { term: { pos: [0, 150, 160], rot: [0, 0, 0], enter: "unfold" }, preview: { pos: [780, -250, -720], rot: [0, -26, 0] },
        browser: { pos: [-780, -250, -720], rot: [0, 26, 0] } } },
  ],
};
// ============================================================================================

const { stage } = Motion, S = SCRIPT, film = document.getElementById("film");
film.style.width = S.width + "px"; film.style.height = S.height + "px";
const layers = [], cuts = [];
const mk = (parent, cls, css = "", html = "") => { const e = document.createElement("div"); e.className = cls; e.style.cssText = css; e.innerHTML = html; parent.append(e); return e; };
let world;

async function setup() {
  const end = (i) => (S.shots[i + 1] ? S.shots[i + 1].at : S.duration);
  const worldLayer = mk(film, "layer");
  layers.push(worldLayer);
  world = World3D.create(mk(worldLayer, ""), { width: S.width, height: S.height, theme: S.theme, accent: S.accent });
  const ui = mk(worldLayer, "layer", S.theme === "night" || S.theme === "dawn" ? "background:linear-gradient(rgba(5,6,14,.5),transparent 30%)" : "");
  const ws = S.shots.map((s, i) => ({ ...s, i })).filter((s) => !s.flat);

  // Camera: one eased move per world shot, then a slow push-in while the shot holds.
  const keys = [[0, ws[0].from || ws[0].camera]];
  for (const s of ws) {
    const mv = s.move ?? 1.4, d = s.drift || [0, 0, -90];
    keys.push([s.at, s.camera, mv], [s.at + mv, { pos: s.camera.pos.map((v, j) => v + d[j]) }, end(s.i) - s.at - mv]);
  }
  world.camera(keys);

  // Windows: present across a contiguous run of world shots; glide between shot poses.
  for (const [id, o] of Object.entries(S.windows)) {
    const runs = ws.filter((s) => s.show && s.show[id]);
    if (!runs.length) continue;
    const first = runs[0], last = runs[runs.length - 1], next = ws[ws.indexOf(last) + 1];
    const k = Object.keys(first.show).indexOf(id);
    world.add({ ...o,
      track: runs.map((s, j) => [j ? s.at : 0, { pos: s.show[id].pos, rot: s.show[id].rot || [0, 0, 0], scale: s.show[id].scale ?? 1 }, s.move ?? 1.4]),
      enter: { type: first.show[id].enter || "rise", at: first.at + 0.35 + k * 0.2, dur: 1.0 },
      exit: next ? { type: last.show[id].exit || "fade", at: next.at, dur: 0.5 } : undefined });
  }

  // Titles: kinetic in, kinetic out before the shot ends.
  const POS = { "top-left": "left:110px;top:92px;text-align:left", top: `left:0;width:${S.width}px;top:92px;text-align:center`,
    "bottom-left": "left:110px;bottom:120px;text-align:left", center: `left:0;width:${S.width}px;top:40%;text-align:center` };
  const OUT = { scramble: "fade", typewriter: "fade", merge: "fade", stomp: "fade" };
  for (const [idx, s] of S.shots.entries()) {
    const last = idx === S.shots.length - 1, e = end(idx);
    if (s.flat) {
      const L = mk(film, "layer flat", `background:${s.flat.bg};color:${s.flat.color};font-size:${s.flat.size || 140}px`);
      layers.push(L);
      cuts.push({ at: s.at, type: s.cut || "dissolve", to: layers.length - 1, dur: s.cutDur });
      s.flat.lines.forEach((ln, j) => Kinetic.animate(mk(L, "", "", ln.text), { in: ln.fx || "rise", at: s.at + 0.35 + j * 0.6 }));
      continue;
    }
    // World shots after a flat shot cut back to the world layer; world-to-world changes are camera moves.
    if (idx > 0 && S.shots[idx - 1].flat) cuts.push({ at: s.at, type: s.cut || "dissolve", to: 0, dur: s.cutDur });
    if (!s.title) continue;
    const pos = POS[s.title.pos || "top-left"], fx = s.title.fx || "mask-up";
    const tEl = mk(ui, "title", `${pos};font-size:${s.title.size || 84}px;color:${S.text}`, s.title.text);
    Kinetic.animate(tEl, { in: fx, at: s.at + 0.45, out: last ? null : OUT[fx] || fx, outAt: e - 0.55 });
    if (s.title.sub) {
      const p = s.title.pos || "top-left", sz = s.title.size || 84;
      const at = p.startsWith("top") ? `top:${92 + sz * 1.25}px` : p === "center" ? `top:calc(40% + ${sz * 1.3}px)` : "bottom:64px";
      const sEl = mk(ui, "sub", `${pos};${at};font-size:32px;color:${S.text}`, s.title.sub);
      Kinetic.animate(sEl, { in: s.title.subFx || "rise", at: s.at + 0.85, out: last ? null : "fade", outAt: e - 0.55 });
    }
  }
}

function render(t) {
  world.render(t);
  Kinetic.render(t);
  Kinetic.sequence(t, layers, cuts);
}
stage({ fps: S.fps, duration: S.duration, width: S.width, height: S.height, render, setup });
</script></body></html>
